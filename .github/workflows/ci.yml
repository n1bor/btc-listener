name: CI

# CI recreates the dev environment: the Aver source is checked out at the
# commit SHA pinned in .aver-version, AT THE SAME PATH the dev machines use
# (/home/owensr/aver/aver), and the toolchain is installed from that path.
# Everything the toolchain then generates — provider hosts, the compiled
# project — resolves aver-rt and aver-lang from that one source, exactly as
# it does locally.
#
# Since jasisz/aver#1099 the toolchain itself no longer needs this: a
# git-installed aver emits git-pinned dependencies. What still does is our
# own providers/*/Cargo.toml, which pin aver-rt by that dev path so the local
# loop and the generated host share one source; a provider pinned any other
# way collides with the toolchain's (two sources of one crate version). Until
# the provider host patches that dependency to its own provenance, the path
# stays. Moving the pin is a one-line PR that this whole pipeline then tests
# — README "Moving the Aver pin". The canary workflow (canary.yml) tracks
# Aver's tip, gating nothing.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: aver format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out the Aver source at the pinned revision, at the dev path
        run: |
          sudo mkdir -p /home/owensr/aver/aver
          sudo chown -R "$USER" /home/owensr/aver
          git -C /home/owensr/aver/aver init --quiet
          git -C /home/owensr/aver/aver fetch --quiet --depth 1 https://github.com/jasisz/aver "$(cat .aver-version)"
          git -C /home/owensr/aver/aver checkout --quiet FETCH_HEAD
      - name: Cache the aver toolchain
        id: aver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aver
          key: aver-path-${{ hashFiles('.aver-version') }}-${{ runner.os }}
      - name: Install aver from that source
        if: steps.aver-cache.outputs.cache-hit != 'true'
        run: cargo install --path /home/owensr/aver/aver aver-lang --locked
      - name: Format check
        run: aver format . --check

  check:
    name: aver check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out the Aver source at the pinned revision, at the dev path
        run: |
          sudo mkdir -p /home/owensr/aver/aver
          sudo chown -R "$USER" /home/owensr/aver
          git -C /home/owensr/aver/aver init --quiet
          git -C /home/owensr/aver/aver fetch --quiet --depth 1 https://github.com/jasisz/aver "$(cat .aver-version)"
          git -C /home/owensr/aver/aver checkout --quiet FETCH_HEAD
      - name: Cache the aver toolchain
        id: aver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aver
          key: aver-path-${{ hashFiles('.aver-version') }}-${{ runner.os }}
      - name: Install aver from that source
        if: steps.aver-cache.outputs.cache-hit != 'true'
        run: cargo install --path /home/owensr/aver/aver aver-lang --locked
      - name: Check
        run: aver check . --module-root .

  provider-tests:
    name: provider tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang, for the RocksDB bindings (ADR 0009)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Check out the Aver source at the pinned revision, at the dev path
        run: |
          sudo mkdir -p /home/owensr/aver/aver
          sudo chown -R "$USER" /home/owensr/aver
          git -C /home/owensr/aver/aver init --quiet
          git -C /home/owensr/aver/aver fetch --quiet --depth 1 https://github.com/jasisz/aver "$(cat .aver-version)"
          git -C /home/owensr/aver/aver checkout --quiet FETCH_HEAD
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            providers/primitives
            providers/kv
      - name: Test the primitives provider (libsecp256k1, RIPEMD-160)
        run: cargo test --manifest-path providers/primitives/Cargo.toml
      - name: Test the kv provider (RocksDB)
        run: cargo test --manifest-path providers/kv/Cargo.toml

  verify:
    name: aver verify (hand-written cases)
    # The program graph from main.av: every module the node reaches, and
    # every hand-written case. The Core corpus (corpus/*.av, 6,050 generated
    # cases with 200 M-step budgets) is not reachable from main and runs
    # beside this job rather than inside it (#219, option 4). Verifying the
    # entry rather than the directory is also what makes this take seconds:
    # `aver verify .` walks the tree and costs an order of magnitude more for
    # the same cases.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang, for the RocksDB bindings (ADR 0009)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Check out the Aver source at the pinned revision, at the dev path
        run: |
          sudo mkdir -p /home/owensr/aver/aver
          sudo chown -R "$USER" /home/owensr/aver
          git -C /home/owensr/aver/aver init --quiet
          git -C /home/owensr/aver/aver fetch --quiet --depth 1 https://github.com/jasisz/aver "$(cat .aver-version)"
          git -C /home/owensr/aver/aver checkout --quiet FETCH_HEAD
      - name: Cache the aver toolchain
        id: aver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aver
          key: aver-path-${{ hashFiles('.aver-version') }}-${{ runner.os }}
      - name: Install aver from that source
        if: steps.aver-cache.outputs.cache-hit != 'true'
        run: cargo install --path /home/owensr/aver/aver aver-lang --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            providers/primitives
            providers/kv
      - name: Cache the provider host, which is a pure function of these inputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/aver
          key: aver-hosts-${{ hashFiles('.aver-version', 'providers/**', 'infra/kv.av', 'domain/primitives.av', 'aver.toml') }}-${{ runner.os }}
      - name: Verify the program graph
        run: |
          aver verify main.av --module-root . | tee verify.log
          tail -1 verify.log | grep -E "\| 0 failed" \
            || { echo "verify reported failures"; exit 1; }

  verify-corpus:
    name: aver verify (Core corpus, ${{ matrix.shard }})
    # The corpus in four shards of about equal cost, so its wall time is one
    # shard's rather than the sum (#219). script_assets_test.json is nearly
    # all of it: measured locally, assetcases8 80 s, assetcases9 68 s,
    # assetcases1 + 4 71 s, and the other 25 files together 80 s. A shard is
    # a list of files verified one at a time, in place under corpus/, so the
    # [[verify.costly]] budgets in aver.toml (matched by path under the
    # module root) apply and the largest Core rows are executed rather than
    # declined. Each run's last line is the count that has to say "0 failed";
    # a run that aborts before a summary fails the grep too.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: assets-8
            files: corpus/assetcases8.av
          - shard: assets-9
            files: corpus/assetcases9.av
          - shard: assets-1-4
            files: corpus/assetcases1.av corpus/assetcases4.av
          - shard: the-rest
            files: >-
              corpus/assetcases2.av corpus/assetcases3.av corpus/assetcases5.av
              corpus/assetcases6.av corpus/assetcases7.av
              corpus/scriptcases1.av corpus/scriptcases2.av corpus/scriptcases3.av
              corpus/scriptcases4.av corpus/scriptcases5.av
              corpus/witnesscases1.av corpus/witnesscases2.av corpus/witnesscases3.av
              corpus/txcases1.av corpus/txcases2.av corpus/txcases3.av corpus/txcases4.av
              corpus/sighashcases1.av corpus/sighashcases2.av
              corpus/bip341cases.av corpus/keyiocases.av corpus/keyioinvalidcases.av
              corpus/base58cases.av corpus/compactblockcases.av corpus/siphashcases.av
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang, for the RocksDB bindings (ADR 0009)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Check out the Aver source at the pinned revision, at the dev path
        run: |
          sudo mkdir -p /home/owensr/aver/aver
          sudo chown -R "$USER" /home/owensr/aver
          git -C /home/owensr/aver/aver init --quiet
          git -C /home/owensr/aver/aver fetch --quiet --depth 1 https://github.com/jasisz/aver "$(cat .aver-version)"
          git -C /home/owensr/aver/aver checkout --quiet FETCH_HEAD
      - name: Cache the aver toolchain
        id: aver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aver
          key: aver-path-${{ hashFiles('.aver-version') }}-${{ runner.os }}
      - name: Install aver from that source
        if: steps.aver-cache.outputs.cache-hit != 'true'
        run: cargo install --path /home/owensr/aver/aver aver-lang --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            providers/primitives
            providers/kv
      - name: Cache the provider host, which is a pure function of these inputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/aver
          key: aver-hosts-${{ hashFiles('.aver-version', 'providers/**', 'infra/kv.av', 'domain/primitives.av', 'aver.toml') }}-${{ runner.os }}
      # Every corpus file has to be in exactly one shard: a file added by
      # tools/refresh_corpora.sh and not listed here would be verified by
      # nobody, and this is the check that says so.
      - name: Every corpus file is in a shard
        run: |
          listed=$(grep -oE 'corpus/[a-z0-9]+\.av' .github/workflows/ci.yml | sort -u)
          present=$(ls corpus/*.av | sort -u)
          diff <(echo "$listed") <(echo "$present") \
            || { echo "corpus/ and the shards in ci.yml disagree"; exit 1; }
      - name: Verify this shard of the Core corpus
        run: |
          for f in ${{ matrix.files }}; do
            echo "== $f"
            aver verify "$f" --module-root . | tee verify.log
            tail -1 verify.log | grep -E "\| 0 failed" \
              || { echo "verify reported failures in $f"; exit 1; }
          done

  compile:
    name: compile to Rust and build
    # Built on 22.04 rather than on ubuntu-latest on purpose (#219). The
    # binary's floor is whatever glibc it was built against, and a 24.04
    # runner would quietly raise that floor above the servers this is for.
    # 22.04 runs on 22.04 and on everything newer. This is the build the
    # release publishes -- the binary job below downloads it rather than
    # building the same thing again on the same runner image.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: libclang, for the RocksDB bindings (ADR 0009)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Check out the Aver source at the pinned revision, at the dev path
        run: |
          sudo mkdir -p /home/owensr/aver/aver
          sudo chown -R "$USER" /home/owensr/aver
          git -C /home/owensr/aver/aver init --quiet
          git -C /home/owensr/aver/aver fetch --quiet --depth 1 https://github.com/jasisz/aver "$(cat .aver-version)"
          git -C /home/owensr/aver/aver checkout --quiet FETCH_HEAD
      # This job's caches are keyed by the runner image as well, and
      # deliberately not shared with the jobs above. Those run on
      # ubuntu-latest; a cached `aver` or a cached target/ built against a
      # newer glibc than this runner's would not run here, and the failure
      # would be a linker error rather than anything that names the cause.
      - name: Cache the aver toolchain
        id: aver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aver
          key: aver-path-${{ hashFiles('.aver-version') }}-ubuntu-22.04
      - name: Install aver from that source
        if: steps.aver-cache.outputs.cache-hit != 'true'
        run: cargo install --path /home/owensr/aver/aver aver-lang --locked
      - name: Cache the generated project's target, keyed by what actually determines it
        uses: actions/cache@v4
        with:
          path: build/target
          key: aver-buildtarget-${{ hashFiles('.aver-version', 'providers/**', 'aver.toml') }}-ubuntu-22.04
      - name: Compile Aver to Rust
        run: aver compile main.av --module-root . -o build
      - name: Build the release binary
        run: cargo build --release --manifest-path build/Cargo.toml
      - name: What it will and will not run on
        run: |
          ldd --version | head -1
          objdump -T build/target/release/main | grep -oE "GLIBC_[0-9.]+" | sort -uV | tail -1
      # Kept so the release publishes the exact binary this job built and
      # this runner image ran, rather than a second build of it (#219).
      - name: Keep the built binary for the release
        uses: actions/upload-artifact@v4
        with:
          name: main-binary
          path: build/target/release/main
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows binary
    # Not in the release job's `needs`, and nothing depends on it: this is an
    # experiment in whether the program builds for Windows at all, and a red
    # cross here should not stop a Linux release going out. Wire it into
    # `binary` once it has been green for a while.
    #
    # Known to be broken at run time even if this builds: Disk.sync on a
    # directory cannot work on Windows (jasisz/aver#1238), and
    # Infra.Blocks.synced calls it once per batch. So a binary from here is
    # a compile-level answer, not a node that runs.
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The rocksdb crate binds RocksDB through bindgen, which wants libclang.
      # The Windows image ships LLVM; the crate only needs to be told where.
      - name: Point bindgen at the image's LLVM (ADR 0009)
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      # providers/*/Cargo.toml pin aver-rt by the dev path, and on Windows a
      # rooted path with no drive resolves against the *current* drive. So the
      # source has to land on whichever drive the workspace is on, or Cargo
      # looks for it on the wrong one.
      - name: Check out the Aver source at the pinned revision, on the workspace drive
        shell: bash
        run: |
          drive=$(pwd | cut -d/ -f2)
          echo "workspace drive: $drive"
          mkdir -p "/$drive/home/owensr/aver/aver"
          git -C "/$drive/home/owensr/aver/aver" init --quiet
          git -C "/$drive/home/owensr/aver/aver" fetch --quiet --depth 1 https://github.com/jasisz/aver "$(cat .aver-version)"
          git -C "/$drive/home/owensr/aver/aver" checkout --quiet FETCH_HEAD
      - name: Cache the aver toolchain
        id: aver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aver.exe
          key: aver-path-${{ hashFiles('.aver-version') }}-windows-latest
      - name: Install aver from that source
        if: steps.aver-cache.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install --path "/$(pwd | cut -d/ -f2)/home/owensr/aver/aver" aver-lang --locked
      - name: Cache the generated project's target
        uses: actions/cache@v4
        with:
          path: build/target
          key: aver-buildtarget-${{ hashFiles('.aver-version', 'providers/**', 'aver.toml') }}-windows-latest
      - name: Compile Aver to Rust
        shell: bash
        run: aver compile main.av --module-root . -o build
      - name: Build the release binary
        shell: bash
        run: cargo build --release --manifest-path build/Cargo.toml
      # Captured rather than piped into head, for the reason the binary job
      # below already gives: a reader that closes the pipe early is an EPIPE
      # the program answers with a panic, exit 101. It is a race, so it
      # passed on the branch and failed on the first push to main.
      - name: Show that it starts
        shell: bash
        run: head -3 <<<"$(build/target/release/main.exe help)"
      - name: Keep it, so the shape of a Windows artefact can be looked at
        uses: actions/upload-artifact@v4
        with:
          name: main-windows
          path: build/target/release/main.exe
          if-no-files-found: error
          retention-days: 7

  wasm-node:
    name: wasm-gc graph and Node host
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: wasm/package-lock.json
      - name: Check out the Aver source at the pinned revision, at the dev path
        run: |
          sudo mkdir -p /home/owensr/aver/aver
          sudo chown -R "$USER" /home/owensr/aver
          git -C /home/owensr/aver/aver init --quiet
          git -C /home/owensr/aver/aver fetch --quiet --depth 1 https://github.com/jasisz/aver "$(cat .aver-version)"
          git -C /home/owensr/aver/aver checkout --quiet FETCH_HEAD
      - name: Cache the wasm-enabled Aver toolchain
        id: aver-wasm-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/aver
          key: aver-wasm-node-${{ hashFiles('.aver-version') }}-${{ runner.os }}
      - name: Install wasm-enabled Aver from that source
        if: steps.aver-wasm-cache.outputs.cache-hit != 'true'
        run: cargo install --path /home/owensr/aver/aver aver-lang --locked --features wasm
      - name: Install the lightweight Node provider host
        run: npm ci --prefix wasm
      - name: Compile the complete application graph to wasm-gc
        run: aver compile main.av --module-root . --target wasm-gc -o "$RUNNER_TEMP/btc-listener-wasm"
      - name: Run the complete listener against a local Bitcoin Peer
        run: node wasm/host.mjs "$RUNNER_TEMP/btc-listener-wasm/main.wasm"
      # Kept so the release publishes the exact module this job proved, rather
      # than a second build of it. The binary job installs aver without
      # --features wasm and could not produce one anyway.
      - name: Keep the proven module for the release
        uses: actions/upload-artifact@v4
        with:
          name: main-wasm
          path: ${{ runner.temp }}/btc-listener-wasm/main.wasm
          if-no-files-found: error
          retention-days: 1

  binary:
    name: publish the binary for main
    # The download server does not build anything -- it is handed a binary, and
    # this is where that binary comes from (issue #138). Only on main, and only
    # behind every gate: a binary that failed verify is worse than none.
    if: github.ref == 'refs/heads/main'
    needs: [format, check, verify, verify-corpus, provider-tests, compile, wasm-node]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Nothing is built here (#219). The compile job built the binary on this
      # same runner image and the wasm-node job proved the module; this job
      # collects both, shows the binary runs at its own floor, and publishes.
      - name: Collect the binary the compile job built
        uses: actions/download-artifact@v4
        with:
          name: main-binary
          path: build/target/release
      - name: Collect the wasm-gc module the Node host proved
        uses: actions/download-artifact@v4
        with:
          name: main-wasm
          path: build/target/release
      # Artifacts do not keep the execute bit. Running `help` here is the proof
      # that what ships starts on a 22.04 box, which is the floor it claims.
      # Captured rather than piped into head: a reader that closes the pipe
      # early is an EPIPE the program answers with a panic, exit 101.
      - name: What it will and will not run on
        run: |
          chmod +x build/target/release/main
          head -1 <<<"$(ldd --version)"
          objdump -T build/target/release/main | grep -oE "GLIBC_[0-9.]+" | sort -uV | tail -1
          head -3 <<<"$(build/target/release/main help)"
      - name: Replace the rolling build with this one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/target/release && sha256sum main main.wasm > SHA256SUMS && cd -
          floor=$(objdump -T build/target/release/main | grep -oE "GLIBC_[0-9.]+" | sort -uV | tail -1)
          # Deleted and recreated rather than edited, so the tag names the
          # commit that actually produced the asset hanging off it.
          gh release delete main-build --yes --cleanup-tag 2>/dev/null || true
          gh release create main-build \
            --target "$GITHUB_SHA" \
            --title "Build of main — $(git rev-parse --short "$GITHUB_SHA")" \
            --notes "$(printf '%s\n' \
              "The compiled node, from \`$GITHUB_SHA\` on main, behind every gate in CI." \
              "" \
              "\`\`\`bash" \
              "curl -sL https://github.com/${GITHUB_REPOSITORY}/releases/download/main-build/main -o main" \
              "chmod +x main && ./main help" \
              "\`\`\`" \
              "" \
              "Needs **$floor** or newer, so Ubuntu 22.04 and up, x86-64. RocksDB and" \
              "libsecp256k1 are compiled in; the only shared libraries are stock ones." \
              "" \
              "### The same program as wasm-gc" \
              "" \
              "\`main.wasm\` is the whole listener compiled to WebAssembly, and it is the" \
              "exact module the Node host ran a Peer handshake through in CI." \
              "" \
              "\`\`\`bash" \
              "curl -sL https://github.com/${GITHUB_REPOSITORY}/releases/download/main-build/main.wasm -o main.wasm" \
              "\`\`\`" \
              "" \
              "It needs a host that supplies the capability imports and JSPI --" \
              "\`wasm/host.mjs\` in this repository is one, on Node 26 or Node 24 with" \
              "\`--experimental-wasm-jspi\`. That host sandboxes Disk to a temporary" \
              "directory it deletes on exit, so it is a conformance harness rather than" \
              "a way to run a node that keeps a chain." \
              "" \
              "This release is replaced on every push to main. \`SHA256SUMS\` covers both" \
              "files. Setting a server up with it: #138.")" \
            build/target/release/main build/target/release/main.wasm build/target/release/SHA256SUMS
