name: Aver canary

# Builds the Aver toolchain from the CURRENT TIP of jasisz/aver — deliberately
# unpinned — checked out at the dev path and installed from it, then runs the
# cheap gates. Early warning for upstream changes: a red canary means the next
# .aver-version bump will need work, and gates nothing today.
#
# Runs nightly, and on demand from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  canary:
    name: check and verify against aver main
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09
      - name: libclang, for the RocksDB bindings (ADR 0009)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Check out the Aver source at tip, at the dev path
        run: |
          sudo mkdir -p /home/owensr/aver
          sudo chown "$USER" /home/owensr/aver
          git clone --quiet https://github.com/jasisz/aver /home/owensr/aver/aver
          git -C /home/owensr/aver/aver log --oneline -1
      - name: Install aver from that source
        run: cargo install --path /home/owensr/aver/aver aver-lang --locked
      - name: Toolchain identity
        run: aver --version
      - name: Check
        run: aver check . --module-root .
      - name: Verify, all cases
        run: |
          aver verify . --module-root . | tee verify.log
          tail -1 verify.log | grep -E "\| 0 failed" \
            || { echo "verify reported failures against aver tip"; exit 1; }
