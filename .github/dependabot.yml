# Keeps the SHA-pinned actions in ci.yml and canary.yml moving with their
# releases (n1bor/btc-listener#280, item 19): a tag can be moved by whoever
# holds the action's repo, a commit cannot, and the binary job publishes with
# contents: write. Dependabot opens a PR per bump; the bump lands like any
# other change, through the gates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /providers/primitives
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /providers/kv
    schedule:
      interval: weekly
