[[check.suppress]]
slug = "verify-coverage"
files = ["domain/version.av"]
reason = """
Domain.Version.payload cannot reach its Result.Err branch: every byte it builds
comes from Int.mod(_, 256), a literal, or the ASCII of a constant user agent, so
Bytes.fromList always succeeds. It keeps the Result because Bytes.fromList over
a computed list is partial by signature, not because the failure is reachable.
"""

[[check.suppress]]
slug = "verify-coverage"
files = ["domain/transaction.av"]
reason = """
decode is the entry point and carries both arms explicitly: a Result.Ok pinning
a whole decoded Transaction field by field, a Result.Err for an out-of-range
byte, and golden vectors for the genesis coinbase and a SegWit transaction whose
ids were derived independently. The readers beneath it — build, assemble,
finish, readInputs, readOutputs and their accumulators — are plumbing that only
decode calls, and are exercised through those vectors. Demanding a separate
Ok/Err pair from each would add cases that restate what decode already proves.
"""

[[check.suppress]]
slug = "verify-coverage"
files = ["domain/base58.av"]
reason = """
Base58.encodeCheck cannot reach its Result.Err branch. The only fallible step is
Bytes.fromList over the version byte and payload, and every caller in
Domain.Script passes a 20-byte slice taken from a script that was itself decoded
from Bytes, so each element is already an octet. It keeps the Result because
Bytes.fromList over a computed list is partial by signature.
"""

[[check.suppress]]
slug = "verify-coverage"
files = ["domain/dns.av"]
reason = """
capturedBytes only decodes a hex fixture captured from a live resolver, so its
Result.Err is unreachable for a constant that is checked in the same file. The
parsing it feeds — addressesOf over that fixture, including its compression
pointers — is asserted directly against the three addresses the resolver
actually returned.
"""
