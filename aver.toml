# Each of these marks a Result.Err branch that cannot be reached, on a function
# that keeps its Result because the builtin it calls is partial by signature.
# Since 0.28.0 verify-coverage flows through the call graph, so these are the
# only ones left: the readers beneath them are covered by their callers' cases.

[[check.suppress]]
slug = "verify-coverage"
files = ["domain/version.av"]
reason = """
Version.payload builds every byte from Int.mod(_, 256), a literal, or the ASCII
of a constant user agent, so Bytes.fromList always succeeds.
"""

[[check.suppress]]
slug = "verify-coverage"
files = ["domain/base58.av"]
reason = """
Base58.encodeCheck and its checksum take a version byte and a 20-byte slice of a
script that was itself decoded from Bytes, so every element is already an octet.
"""

[[check.suppress]]
slug = "verify-coverage"
files = ["infra/download.av"]
reason = """
heightsHeld, locatorFor, idsHeld, idsAt, nextId and prependId keep a Result
because Store.get and Store.has are partial by signature: both refuse a key the
log format could not have written. Every key these six build comes from
Domain.Index.heightKey, which is "h:" and eight digits, so the Err arm is
unreachable from here and no example can pin it.

This waiver is wider than the six functions and that is its cost: a genuine
coverage gap elsewhere in the file would go unreported. Narrowing it means
moving the Index-reading helpers into a module of their own, which is worth
doing when something else needs them.
"""

[[check.suppress]]
slug = "verify-coverage"
files = ["domain/dns.av"]
reason = """
capturedBytes decodes a constant hex fixture captured from a live resolver. Its
length and leading bytes are asserted in the same file, so a decode failure
would fail those cases first.
"""
