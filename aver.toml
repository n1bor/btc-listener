# The provider for the Primitives capability. Aver emits the dependency and a
# bootstrap that installs and preflights the binding; Cargo resolves it when the
# generated project is built. Nothing is downloaded at compile time.

[providers]
schema = 1

[[providers.bindings]]
capability = "Domain.Primitives"
crate = "btc_listener_primitives"
package = "btc-listener-primitives"
path = "providers/primitives"
factory = "primitives_binding"

[[providers.bindings]]
capability = "Infra.Kv"
crate = "btc_listener_kv"
package = "btc-listener-kv"
path = "providers/kv"
factory = "kv_binding"

# The two Core corpus cases that need more than the default per-case budget.
# Both are the largest input in their file, which is where a quadratic legacy
# sighash or a rope shows itself -- so they are the cases most worth running,
# and they were dropped for years because the only thing the cap could say
# about them was "case aborted". n1bor/btc-listener#75, jasisz/aver#1071.

[[verify.costly]]
fn         = "case"
files      = ["corpus/scriptcases*.av"]
step-limit = 200000000
reason     = "one row of script_tests.json is a 10,000 byte Script at the consensus limit, executed rather than refused on size; that is the case, not a runaway"

[[verify.costly]]
fn         = "case"
files      = ["corpus/txcases*.av"]
step-limit = 200000000
reason     = "one row of tx_valid.json is a 1,911 byte Transaction with twelve inputs, each of which hashes the whole Transaction; that is the case, not a runaway"

[[verify.costly]]
fn         = "case"
files      = ["corpus/assetcases*.av"]
step-limit = 200000000
reason     = "one entry of script_assets_test.json is a 406 KB tapscript spend with a witness stack at the consensus limit, executed rather than refused on size; that is the case, not a runaway"

# A dial's deadline is deployment policy, not a parameter, and 5 is the
# runtime's default -- set here so the number the follow loop budgets around
# is written where it acts, not discovered in aver-rt. The deadline itself
# arrived with jasisz/aver#1118, which is closed; this setting is not its
# workaround and does not retire with it, which is why it is still here now
# that jasisz/aver#1125 has closed too. What changed with #1125 is who waits:
# the dial is a key in Tcp.poll (Infra.Peers.joined), so this deadline ends
# one Candidate rather than holding up every Peer for five seconds.
# Twenty rather than five since #275: during a Set catch-up the loop starts a
# dial between two chunks and next asks about it after the chunk, ten seconds
# later, and the runtime judges the deadline before the socket (jasisz/aver#1213),
# so a five-second deadline turned every dial made while walking into "timed
# out" -- 134 of 134 on mainnet, zero Peers gained. Twenty covers a chunk with
# room; a dead Candidate costs the one dial slot twenty seconds, three a minute.
[effects.Tcp]
connect_timeout_secs = 20
